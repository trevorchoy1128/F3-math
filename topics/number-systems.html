<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>數字系統｜中三數學學習站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/data.js"></script>
  <script src="../assets/common.js"></script>
  <style>
    /* 位值表 */
    .pv td { min-width: 54px; }
    .pv .pv-name { font-size: 13px; color: var(--muted); }
    .pv .pv-v { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .pv .pv-d { font-size: 22px; font-weight: 700; color: var(--c); }
    .pv .zero { color: var(--muted); opacity: .55; }
    .expand { margin-top: 4px; font-size: 17px; line-height: 1.9; }
    .expand > div:not(:first-child) { padding-left: 1em; }
    .error { color: var(--dh); font-size: 14px; margin-top: 8px; }

    /* 進位計數器 */
    .odo-row { margin: 12px 0; }
    .odo-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .odo { display: flex; gap: 4px; }
    .cell { width: 36px; text-align: center; }
    .cell b {
      display: block; height: 44px; line-height: 42px; font-size: 24px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
    }
    .cell small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .cell.lead b { color: var(--muted); opacity: .4; }
    .cell.changed b { animation: pop .45s ease; border-color: var(--c); background: var(--c-soft); }
    @keyframes pop { from { transform: translateY(-8px); opacity: .2; } to { transform: none; opacity: 1; } }
    .counter-msg { min-height: 50px; font-size: 15px; margin: 4px 0 12px; }

    /* 二進制開關 */
    .switches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; max-width: 520px; }
    .sw {
      font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: 10px; padding: 8px 0 6px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .sw .bulb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--border); transition: .15s; }
    .sw[aria-pressed="true"] { border-color: var(--c); background: var(--c-soft); }
    .sw[aria-pressed="true"] .bulb { background: #f5b82e; border-color: #d99a0b; box-shadow: 0 0 10px #f5b82e99; }
    .sw .sw-bit { font-size: 20px; font-weight: 700; }
    .sw .sw-val { font-size: 12px; color: var(--muted); }
    .sw-out { margin: 12px 0; font-size: 17px; line-height: 1.8; }

    /* 例題 */
    .example { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; background: var(--bg); }
    .ex-q { font-weight: 600; margin-bottom: 10px; }
    .ex-tag { display: inline-block; background: var(--c); color: var(--surface); border-radius: 6px; font-size: 13px; padding: 1px 8px; margin-right: 6px; }
    .ex-steps li { margin-bottom: 10px; }
    .ex-ans { font-weight: 700; color: var(--c); margin: 0 0 12px; }

    /* 練習 */
    .quiz-q { font-size: 20px; margin: 10px 0 12px; }
    .score { color: var(--muted); font-size: 14px; margin-left: auto; }

    @media (max-width: 420px) {
      .cell { width: 30px; }
      .cell b { font-size: 20px; }
      .pv td { min-width: 40px; padding: 6px; }
      .sw .sw-bit { font-size: 17px; }
      .sw .sw-val { font-size: 11px; }
    }
  </style>
</head>
<body data-topic="number-systems">
  <header id="topbar"></header>

  <main class="wrap">
    <div id="topic-head"></div>

    <div class="topic-layout">
      <nav class="toc" id="toc" aria-label="本課目錄"></nav>

      <div>
        <section class="section" id="explore">
          <h2>互動探索</h2>

          <div class="widget">
            <p class="widget-title">① 位值表</p>
            <p class="widget-hint">輸入一個數，看看每個數字代表多少。切換進制時，會換成同一個數的另一種寫法。</p>
            <div class="row">
              <div class="seg" id="pv-base" role="group" aria-label="選擇進制">
                <button type="button" data-base="2" aria-pressed="true">二進制</button>
                <button type="button" data-base="10" aria-pressed="false">十進制</button>
              </div>
              <input id="pv-input" class="field" value="1011" inputmode="numeric" autocomplete="off" maxlength="10" aria-label="輸入數字">
              <button type="button" class="btn" id="pv-random">隨機</button>
            </div>
            <div id="pv-error" class="error" hidden></div>
            <div id="pv-out"></div>
          </div>

          <div class="widget">
            <p class="widget-title">② 逢十進一 vs 逢二進一</p>
            <p class="widget-hint">按「+1」逐一數數，比較兩種進制何時進位。有變化的格會亮起。</p>
            <div class="odo-row">
              <div class="odo-label">十進制</div>
              <div class="odo" id="odo-dec"></div>
            </div>
            <div class="odo-row">
              <div class="odo-label">二進制</div>
              <div class="odo" id="odo-bin"></div>
            </div>
            <div class="counter-msg" id="counter-msg" aria-live="polite"></div>
            <div class="row">
              <button type="button" class="btn" id="cnt-minus">−1</button>
              <button type="button" class="btn primary" id="cnt-plus">+1</button>
              <button type="button" class="btn" id="cnt-play">▶ 自動</button>
              <button type="button" class="btn" id="cnt-reset">重設</button>
            </div>
          </div>

          <div class="widget">
            <p class="widget-title">③ 二進制開關</p>
            <p class="widget-hint">每個燈泡代表一個位。按下開關（1 = 開，0 = 關），看看十進制數值如何變化。</p>
            <div class="switches" id="switches"></div>
            <div class="sw-out" id="sw-out" aria-live="polite"></div>
            <div class="row">
              <button type="button" class="btn primary" id="sw-challenge">挑戰：隨機目標數</button>
              <button type="button" class="btn" id="sw-clear">全部關掉</button>
            </div>
            <div id="sw-feedback"></div>
          </div>
        </section>

        <section class="section" id="examples">
          <h2>例題</h2>
          <div id="examples-body"></div>
        </section>

        <section class="section" id="practice">
          <h2>練習</h2>
          <p>把二進制數轉換為十進制數。答錯一次會有提示，答錯兩次會顯示答案。</p>
          <div class="row">
            <div class="seg" id="quiz-level" role="group" aria-label="選擇難度">
              <button type="button" data-bits="4" aria-pressed="true">初級（4 位）</button>
              <button type="button" data-bits="6" aria-pressed="false">中級（6 位）</button>
              <button type="button" data-bits="8" aria-pressed="false">高級（8 位）</button>
            </div>
            <span class="score" id="quiz-score"></span>
          </div>
          <div class="quiz-q" id="quiz-q"></div>
          <div class="row">
            <input id="quiz-input" class="field" inputmode="numeric" autocomplete="off" placeholder="十進制答案" aria-label="十進制答案">
            <button type="button" class="btn primary" id="quiz-check">檢查</button>
            <button type="button" class="btn" id="quiz-show">顯示答案</button>
            <button type="button" class="btn" id="quiz-next">下一題</button>
          </div>
          <div id="quiz-feedback" aria-live="polite"></div>
        </section>

        <nav class="pager" id="pager"></nav>
      </div>
    </div>
  </main>

  <footer><div class="wrap">中三數學學習站 · <a href="../notes/number-systems.html">教師筆記</a></div></footer>

  <script src="../assets/topic.js"></script>
  <script src="number-systems.js"></script>
</body>
</html>
